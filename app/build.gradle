plugins { id 'com.android.application' }

def appProps = new Properties()
file('../app.properties').withInputStream { appProps.load(it) }

android {
    namespace 'com.battlefieldsandbox.game'
    compileSdk 34

    defaultConfig {
        applicationId appProps.getProperty('APP_ID').trim()
        minSdk 24
        targetSdk 34
        versionCode appProps.getProperty('VERSION_CODE').trim().toInteger()
        versionName appProps.getProperty('VERSION_NAME').trim()
    }

    // The signing key is read from environment variables (set by the GitHub workflow from your secrets).
    def ksFile = System.getenv('KEYSTORE_FILE')
    if (ksFile) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksFile) { signingConfig signingConfigs.release }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    androidResources {
        noCompress 'woff2', 'html'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
