<style>
/* LAYOUT: top bar / [tool rail | canvas stage | info panel] / builder drawer. Dark slate HUD, cyan primary, lime + orange status. */
:root{
  --bg:#070d14; --panel:#0d1822; --panel2:#122232; --panel3:#173047; --line:#1f3347; --line2:#2b4863;
  --fg:#d7e5f2; --muted:#6f8aa3; --dim:#41586d; --accent:#3db9ff; --accent2:#1f7fc4; --lime:#9be564; --orange:#ff9b3d; --red:#ff5a5a; --gold:#ffd24a; --violet:#b58cff;
  --ui:'Rajdhani','Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --num:'Barlow Condensed','Rajdhani','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;font-weight:500;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
*{box-sizing:border-box}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
canvas,img{image-rendering:pixelated;image-rendering:crisp-edges}
#app{height:100%;display:grid;grid-template-rows:46px minmax(0,1fr) auto;min-height:0}
body.nui #topbar,body.nui #tools,body.nui #panel,body.nui #drawer{display:none}
body.nui #app{grid-template-rows:0 minmax(0,1fr) 0}
body.nui #main{grid-template-columns:0 1fr 0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#0f1d2a,#0b1620);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
#topbar .brand{font-family:var(--num);font-weight:700;letter-spacing:.16em;font-size:15px;color:var(--accent);margin-right:6px}
#topbar .brand b{color:var(--fg)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;line-height:18px;transition:background .12s,transform .08s,border-color .12s,color .12s;white-space:nowrap}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible,.slot:focus-visible,.rule:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.on{background:var(--accent2);border-color:var(--accent);color:#fff}
.btn.go{background:#1d6b2f;border-color:#3fbf5a;color:#eaffea;min-width:84px}
.btn.go.paused{background:#7a4a0a;border-color:var(--orange);color:#fff}
.btn.sm{padding:2px 7px;font-size:11px}
.btn.danger:hover{background:#5a1f1f;border-color:var(--red)}
.btn.ico{padding:4px 8px;min-width:30px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg .btn{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg .btn:last-child{border-right:0}
.speedwrap{display:flex;align-items:center;gap:6px}
.speedval{font-family:var(--num);font-size:16px;min-width:52px;text-align:center;color:var(--accent);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--line2);border-radius:2px;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:16px;background:var(--accent);border-radius:2px;cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:16px;background:var(--accent);border-radius:2px;cursor:pointer;border:0}
input[type=number],input[type=text],select{background:#0a141d;border:1px solid var(--line);border-radius:3px;padding:3px 6px;color:var(--fg);outline:none}
input[type=number]:hover,input[type=text]:hover,select:hover{border-color:var(--line2)}
select{padding:3px 4px}
.tag{font-family:var(--num);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.statchip{font-family:var(--num);font-size:13px;letter-spacing:.08em;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:#0a141d;color:var(--muted)}
.statchip b{color:var(--fg)}
.statchip.warn b{color:var(--orange)}

/* ---------- main ---------- */
#main{display:grid;grid-template-columns:86px minmax(0,1fr) 340px;min-height:0;min-width:0}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:4px;overflow-y:auto}
.tool{width:40px;height:44px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .12s;padding:0}
.tool:hover{background:var(--panel3);border-color:var(--line2)}
.tool.on{background:var(--accent2);border-color:var(--accent)}
.tool canvas{display:block}
.tool span{font-family:var(--num);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tool.on span{color:#fff}
#stage{position:relative;min-width:0;min-height:0;background:#04080c;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#mini{position:absolute;left:8px;bottom:8px;border:1px solid var(--line2);background:#050a10cc;z-index:3;cursor:pointer}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:6}
.toast{background:#0d1822f2;border:1px solid var(--line2);border-left:3px solid var(--accent);padding:6px 12px;border-radius:3px;font-weight:600;letter-spacing:.04em;animation:toastin .22s cubic-bezier(.2,1.4,.4,1);box-shadow:0 4px 18px #0008}
.toast.warn{border-left-color:var(--orange)}.toast.bad{border-left-color:var(--red)}.toast.good{border-left-color:var(--lime)}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .3s}
@keyframes toastin{from{opacity:0;transform:translateY(-10px) scale(.92)}to{opacity:1;transform:none}}
#fpsbox{position:absolute;right:8px;top:8px;font-family:var(--num);font-size:12px;color:var(--lime);background:#050a10aa;padding:2px 6px;border-radius:3px;z-index:3;pointer-events:none;white-space:pre}
#stagehud{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:3;pointer-events:none;flex-wrap:wrap;max-width:70%}
#stagehud .statchip{background:#050a10cc}
#hovercard{position:absolute;z-index:4;pointer-events:none;background:#0a141dee;border:1px solid var(--line2);border-radius:4px;padding:6px 8px;display:none;min-width:150px;font-size:13px}
#hovercard .hn{font-weight:700;font-size:15px}
#hovercard .hs{color:var(--muted);font-size:12px}
#banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:7;background:#02060acc}
#banner.show{display:flex;animation:fadein .3s}
.vcard{max-height:96%;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-top:4px solid var(--accent);padding:18px 28px;min-width:340px;max-width:92%;text-align:center;box-shadow:0 10px 50px #000a;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.vcard h2{margin:0;font-family:var(--num);font-size:44px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.vcard .sub{color:var(--muted);letter-spacing:.2em;font-family:var(--num);text-transform:uppercase;margin:6px 0 12px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.vgrid div{background:#0a141d;border:1px solid var(--line);padding:6px}
.vgrid b{display:block;font-family:var(--num);font-size:24px}
.vgrid span{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.vcard .stag>*{animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* ---------- info panel ---------- */
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;transition:transform .25s ease}
#panelscroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 4px;min-height:0}
.sec{margin-bottom:12px}
.sech{display:flex;align-items:center;justify-content:space-between;font-family:var(--num);font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:0 0 6px;cursor:default}
.sech b{color:var(--fg);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 10px 4px}
.card .k{font-family:var(--num);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.card .v{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.card .v.pop{animation:numpop .25s ease-out}
@keyframes numpop{0%{transform:scale(1.18)}100%{transform:none}}
.c-alive .v{color:var(--accent)}.c-dead .v{color:var(--orange)}.c-kills .v{color:var(--fg)}
.trow{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;gap:8px;margin:5px 0;font-family:var(--num);font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.trow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.trow.sel .nm::before{content:"▸ "}
.bar{position:relative;height:9px;background:#0a141d;border:1px solid #1a2d3f}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block}
.bar .trail{background:#fff6;transition:width .9s .25s ease-out}
.bar .fill{transition:width .2s ease-out}
.trow .st{text-align:right;font-weight:700;font-size:12px}
.st.fight{color:var(--orange)}.st.win{color:var(--lime)}.st.out{color:#6ea4ff}.st.dead{color:var(--red)}.st.idle{color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.slot{position:relative;aspect-ratio:1/1;background:#0b1620;border:1px solid #14232f;border-radius:2px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:border-color .12s,background .12s}
.slot canvas{display:block;opacity:.18;filter:grayscale(.6)}
.slot.on{background:#16293a;border-color:#4a6c8c}
.slot.on canvas{opacity:1;filter:none}
.slot.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot.dead canvas{opacity:.4}
.slot.empty{cursor:default;border-color:#101c27}
.slot .ct{position:absolute;right:3px;bottom:1px;font-family:var(--num);font-size:13px;font-weight:700;color:var(--gold);text-shadow:0 1px 2px #000,0 0 3px #000}
.slot .ct.zero{color:var(--dim)}
.rgrid-wrap{max-height:176px;overflow-y:auto}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rule{position:relative;background:#101d29;border:1px solid #182a3a;color:#586f84;padding:5px 8px 5px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;font-family:var(--num);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;transition:all .12s;min-height:30px;justify-content:center}
.rule:hover{background:#15283a;color:var(--fg)}
.rule.on{background:#1d62d6;border-color:#3b82f0;color:#fff}
.rule.on:hover{background:#2570ee}
.rule small{display:none;font-family:var(--ui);font-size:11px;letter-spacing:0;text-transform:none;font-weight:500;opacity:.8;margin-top:2px;line-height:1.15}
body.showdesc .rule small,body.showdesc .desc{display:block}
.desc{display:none;color:var(--muted);font-size:12px;margin-top:2px}
.log{max-height:150px;overflow-y:auto}
.logline{display:flex;gap:7px;align-items:flex-start;font-family:var(--num);font-size:13px;letter-spacing:.07em;text-transform:uppercase;margin:4px 0;animation:rise .25s both}
.logline i{display:block;width:3px;align-self:stretch;min-height:14px;flex:none}
.logline .tm{color:var(--dim);flex:none;min-width:36px}
.logline span{line-height:1.15}
.logline .m{color:var(--fg)}
#footer{border-top:1px solid var(--line);background:#0a141d;padding:8px 12px 10px}
.fclock{display:flex;justify-content:space-between;font-family:var(--num);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;margin-bottom:6px}
.fclock span:last-child{color:var(--muted)}
.popgrid{display:grid;grid-template-columns:repeat(40,1fr);gap:2px}
.popgrid i{display:block;height:7px;background:#14232f}
.popgrid i.f{background:#2c5f8a}.popgrid i.r{background:#a53434}
.insp{background:var(--panel2);border:1px solid var(--line);padding:8px;border-radius:3px}
.insp .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.insp .hd .nm{font-size:16px;font-weight:700;line-height:1}
.insp .hd .path{font-size:11px;color:var(--muted);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 8px;font-family:var(--num);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px solid #162838;padding:1px 0}
.kv div span{color:var(--muted)}
.kv div b{font-weight:700;font-variant-numeric:tabular-nums}
.hpbar{height:10px;background:#0a141d;border:1px solid #1a2d3f;position:relative;margin:4px 0}
.hpbar i{position:absolute;left:0;top:0;bottom:0}
.hpbar em{position:absolute;inset:0;font-style:normal;font-family:var(--num);font-size:10px;text-align:center;line-height:8px;color:#fff;text-shadow:0 0 2px #000}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#0a141d;border:1px solid var(--line);padding:1px 6px 1px 3px;border-radius:2px;font-size:12px;font-family:var(--num);letter-spacing:.06em;text-transform:uppercase}
.chip canvas{display:block}
.chip.btnlike{cursor:pointer}.chip.btnlike:hover{border-color:var(--accent)}

/* ---------- drawer ---------- */
#drawer{background:var(--panel);border-top:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
#spawnbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 10px;background:#0a141d;border-bottom:1px solid var(--line)}
.sb-group{display:flex;align-items:center;gap:5px}
.sb-label{font-family:var(--num);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.tchip{width:28px;height:26px;border-radius:3px;border:2px solid transparent;font-family:var(--num);font-weight:700;font-size:14px;cursor:pointer;color:#06101a;transition:transform .1s,border-color .1s,opacity .12s;padding:0}
.tchip:hover{transform:translateY(-1px)}
.tchip.sel{border-color:#fff;box-shadow:0 0 0 2px #0008}
.tchip.off{opacity:.3;background:#223 !important;color:var(--fg)}
.brushcard{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:2px 10px 2px 4px;min-width:200px;border-radius:3px}
.brushcard .bn{font-weight:700;font-size:15px;line-height:1}
.brushcard .bp{font-size:11px;color:var(--muted)}
#countin{width:92px;font-family:var(--num);font-size:20px;font-weight:700;text-align:center;color:var(--accent);padding:1px 4px}
.cnt{display:flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid var(--accent2);background:#0c1c2b;border-radius:4px}
#tabs{display:flex;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--line);align-items:flex-end}
.tab{background:transparent;border:1px solid transparent;border-bottom:0;padding:4px 14px;font-family:var(--num);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);cursor:pointer;text-transform:uppercase}

.pane{display:none;height:100%}
.pane.on{display:flex;gap:12px;min-width:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}

.cattop{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.cgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));grid-auto-rows:46px;gap:4px;align-content:start;padding-right:4px}

.cell:hover{background:#15283a;border-color:#4a6c8c}
.cell.sel{border-color:var(--accent);background:#14304a}
.cell .rb{position:absolute;left:1px;top:1px}
.cell .tp{position:absolute;right:2px;bottom:1px;display:flex;gap:1px}
.cell .tp i{display:block;width:3px;height:3px;background:var(--gold)}
.detail{width:330px;flex:none;background:var(--panel2);border:1px solid var(--line);padding:8px;display:flex;gap:10px;overflow-y:auto;border-radius:3px}
.detail .port{background:#0a141d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;width:108px;height:108px;flex:none}
.detail .nm{font-size:18px;font-weight:700;line-height:1}
.detail .path{font-size:12px;color:var(--muted)}
.detail p{margin:6px 0 0;font-size:13px;color:#a9bdce;line-height:1.25}
.mixbox{width:200px;flex:none;border:1px solid var(--line);background:var(--panel2);padding:6px;display:flex;flex-direction:column;border-radius:3px}
.mixlist{flex:1;overflow-y:auto}
.mixrow{display:flex;align-items:center;gap:4px;font-size:12px;margin:2px 0}
.mixrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixrow input{width:46px;padding:1px 3px}
.teamcards{display:flex;gap:8px;overflow-x:auto;flex:1;padding-bottom:4px}
.tcard{flex:none;width:224px;background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--tc,#888);padding:6px 8px;display:flex;flex-direction:column;gap:4px;border-radius:3px}
.tcard.disabled{opacity:.5}
.tcard .brow{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}.tcard .brow .btn{flex:1 1 auto;padding:0 6px;white-space:nowrap;font-size:11px}
.tcard .row{display:flex;gap:5px;align-items:center}
.tcard .row label{font-size:11px;color:var(--muted);letter-spacing:.1em;width:46px;font-family:var(--num);text-transform:uppercase}
.tcard input[type=text]{width:100%;min-width:0}
.tcard input[type=color]{width:28px;height:22px;padding:0;border:1px solid var(--line);background:none}
.tcard select{flex:1;min-width:0}
.dip{background:var(--panel2);border:1px solid var(--line);padding:6px 8px;flex:none;border-radius:3px}
.dip table{border-collapse:collapse;font-family:var(--num);font-size:12px}
.dip td,.dip th{padding:1px 2px;text-align:center}
.dip .dc{width:24px;height:20px;border:1px solid var(--line);background:#0a141d;cursor:pointer;font-weight:700;padding:0}
.dip .dc.H{color:var(--red)}.dip .dc.A{color:var(--lime)}.dip .dc.N{color:var(--muted)}
.wgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.wrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.biome{display:flex;flex-direction:column;align-items:center;gap:3px;background:#0b1620;border:1px solid #162838;padding:4px;cursor:pointer;width:88px;font-family:var(--num);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:2px}
.biome.on{border-color:var(--accent);background:#14304a}
.biome canvas{display:block;width:64px;height:40px}

/* ---------- modals / tooltip ---------- */
#modalroot{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#02060acc;padding:10px}
#modalroot.show{display:flex;animation:fadein .2s}
.modal{background:var(--panel);border:1px solid var(--line2);border-top:3px solid var(--accent);max-width:min(640px,96vw);max-height:92vh;overflow-y:auto;padding:14px 18px;box-shadow:0 12px 60px #000;animation:pop .3s cubic-bezier(.2,1.4,.4,1);border-radius:3px}
.modal h3{margin:0 0 8px;font-family:var(--num);letter-spacing:.14em;text-transform:uppercase;font-size:20px}
.modal .mb{color:#b9cbdb;line-height:1.35}
.modal .ma{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.hk{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0}
.hk kbd{font-family:var(--num);background:#0a141d;border:1px solid var(--line2);border-bottom-width:2px;padding:0 6px;border-radius:3px;font-weight:700;color:var(--accent);justify-self:start;font-size:13px}
.setg{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.setg label{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px}
.setg .full{grid-column:1/-1}
#tip{position:fixed;z-index:60;pointer-events:none;background:#0a141df5;border:1px solid var(--line2);padding:5px 8px;max-width:280px;font-size:12.5px;line-height:1.25;display:none;border-radius:3px;box-shadow:0 4px 16px #000a}
#tip b{color:var(--accent)}
#panelbtn{display:none}
@media (max-width:1050px){
  #main{grid-template-columns:86px minmax(0,1fr) 0}
  #panel{position:fixed;right:0;top:46px;bottom:0;width:min(340px,92vw);z-index:20;transform:translateX(100%);box-shadow:-8px 0 30px #000a}

}
@media (max-width:760px){.mixbox{display:none}.detail .port{width:72px;height:72px}.detail{width:220px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}

/* ---------- Phase 2: stats / items / pickups panes, boss bars ---------- */
.pane.on.scroll{overflow:hidden}
.scol{display:flex;flex-direction:column;gap:6px;min-width:0;height:100%}
.scol.fix{flex:none}
.scol.grow{flex:1}
.scroll-y{overflow-y:auto;overflow-x:hidden;padding-right:4px}
.scroll-y::-webkit-scrollbar{width:8px}.scroll-y::-webkit-scrollbar-thumb{background:#1f3347;border-radius:4px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.box h4{margin:0 0 5px;font-family:var(--num);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.srows{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:2px 14px}

.srow label{font-family:var(--num);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:#9bb3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
.srow.ov label{color:var(--accent)}
.srow input[type=number]{width:62px;padding:1px 4px;font-family:var(--num);font-size:13px;text-align:right}
.srow .qb{display:flex;gap:1px}
.srow .qb button{background:#0e1b27;border:1px solid #1a2d3d;color:#8fb0c8;font-size:10px;padding:0 3px;cursor:pointer;line-height:15px;font-family:var(--num);border-radius:2px}
.srow .qb button:hover{background:#18354d;color:#fff}
.srow .rs{background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px;padding:0}
.srow.ov .rs{color:var(--accent)}
.srow .fin{position:absolute}
.hint{font-size:12px;color:var(--muted);line-height:1.25}
.sizebtns{display:flex;flex-wrap:wrap;gap:3px}
.trow2{display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px solid #12222f;flex-wrap:wrap}

.trow2.off .tn{color:#587087}
.trow2.ov .tn{color:var(--accent)}
.tprm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);font-family:var(--num);letter-spacing:.05em;text-transform:uppercase}
.tprm input[type=number]{width:58px;padding:0 3px;font-size:12px}
.tprm input[type=text],.tprm select{width:96px;padding:0 3px;font-size:12px}
.tprm input[type=color]{width:26px;height:18px;padding:0;border:1px solid var(--line);background:none}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:3px;align-content:start}
.icell{position:relative;background:#0b1620;border:2px solid #162838;border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;height:40px;transition:border-color .1s,background .1s}
.icell:hover{background:#15283a}
.icell.sel{background:#14304a;box-shadow:0 0 0 1px #fff}
.icell[draggable=true]{cursor:grab}
.slotrow{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.slotbox{position:relative;border:1px dashed #2b4863;height:44px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dim);font-family:var(--num);letter-spacing:.08em;text-transform:uppercase;text-align:center;line-height:1;cursor:pointer;background:#0a141d}
.slotbox.full{border-style:solid}
.slotbox .x{position:absolute;right:1px;top:0;color:#ff8080;font-size:12px;display:none;line-height:12px}
.slotbox.full:hover .x{display:block}
.slotbox.drop{box-shadow:0 0 0 2px var(--accent)}
.fgrid{display:grid;grid-template-columns:96px 1fr;gap:4px 8px;align-items:center;font-size:13px}
.fgrid label{font-family:var(--num);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fgrid input[type=number],.fgrid input[type=text],.fgrid select{width:100%;min-width:0}
.pkcell{display:flex;align-items:center;gap:6px;background:#0b1620;border:1px solid #162838;padding:2px 6px 2px 3px;cursor:pointer;border-radius:2px;font-family:var(--num);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.pkcell:hover{background:#15283a}.pkcell.sel{border-color:var(--accent);background:#14304a}
#bossbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;width:min(560px,70%);pointer-events:none;z-index:6}
.bb{background:#080e14e6;border:1px solid #3a2d12;border-top:2px solid var(--gold);padding:3px 8px 5px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.bb .bn{font-family:var(--num);font-weight:700;letter-spacing:.2em;font-size:13px;text-transform:uppercase;display:flex;justify-content:space-between;color:#ffe9a0;text-shadow:0 1px 2px #000}
.bb .bt{position:relative;height:12px;background:#1a0e0e;border:1px solid #000;margin-top:2px;overflow:hidden}
.bb .bt i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6a5a,#c4262f)}
.bb .bt u{position:absolute;left:0;top:0;bottom:0;background:#ffffff55;transition:width .6s ease-out}
.bb .bt s{position:absolute;left:0;top:0;height:3px;background:#7fd0ff}
#batchMark{cursor:pointer;color:#06101a;background:var(--gold);border-color:var(--gold);font-weight:700}
.dropglow{outline:2px dashed var(--accent);outline-offset:-4px}

/* ---------- Phase 3: powers, build, codex, data, replay, RTL ---------- */
#tools{display:grid;grid-template-columns:repeat(2,38px);grid-auto-rows:42px;justify-content:center;align-content:start;gap:4px;padding:6px 0}

.cxrow:hover{background:#15283a}.cxrow.sel{border-color:var(--accent);background:#14304a}
.cxic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;background:#0a141d}
.cxn{display:flex;flex-direction:column;min-width:0;line-height:1.1}.cxn b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cxn small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cxhd{display:flex;gap:10px;align-items:center;margin-bottom:6px}

.cxbody .tipbox b{color:var(--gold);margin-right:4px}
.cxtraits{margin-top:8px}.cxtraits>div{font-size:12.5px;margin:3px 0;color:#9bb3c7}.cxtraits b{color:var(--accent)}
.cxul{margin:6px 0 0;padding-left:18px;color:#a9bdce;font-size:13px}
#replaybar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#0d1822f5;border:1px solid var(--line2);border-top:3px solid var(--violet);padding:6px 10px;z-index:8;width:min(640px,94%);box-shadow:0 8px 30px #000a}
#replaybar .rp{font-family:var(--num);letter-spacing:.16em;color:var(--violet);white-space:nowrap}

body.replaying #stage::after{content:"";position:absolute;inset:0;border:3px solid var(--violet);pointer-events:none;z-index:7;opacity:.7}
textarea{font-family:inherit}
@media (max-width:1500px){
  #topbar .brand b,#capChip{display:none}#topbar .lbl{display:none}#topbar{gap:4px}#topbar .btn{padding:4px 7px}.speedwrap input{width:70px}
}

body.rtl .logline .tm{direction:ltr}

/* ===== UTIL ===== */

/* =====================================================================
   ASSETS — decode the embedded PNGs once, build sprite caches + variants
   ===================================================================== */
const AS = {};            // id -> asset
const AS_LIST = [];       // manifest order
const AS_BY_NAME = {};    // manifest name -> asset (first one wins, names are verbatim)
const _base = new Map(), _flip = new Map(), _flash = new Map(), _outline = new Map(), _corpse = new Map(), _shadow = new Map(), _ring = new Map(), _pip = new Map();

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return c; }
function ctx2(c) { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

async function loadAssets(onProgress) {
  const missing = [];
  let done = 0;
  await Promise.all(ASSET_ROWS.map(r => new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const cv = mk(r.w, r.h); ctx2(cv).drawImage(img, 0, 0);
      const a = { id: r.i, path: r.p, category: r.c, group: r.g, name: r.n, note: r.nt, w: r.w, h: r.h, bx: r.bx, by: r.by, bw: r.bw, bh: r.bh, col: r.col, cv };
      AS[a.id] = a; if (onProgress && ++done % 60 === 0) onProgress(done / ASSET_ROWS.length);
      res();
    };
    img.onerror = () => { missing.push(r.p); res(); };
    img.src = 'data:image/png;base64,' + r.d;
  })));
  if (missing.length) throw new Error('Sprites failed to decode:\n' + missing.join('\n'));
  for (const r of ASSET_ROWS) { const a = AS[r.i]; AS_LIST.push(a); if (!(a.name in AS_BY_NAME)) AS_BY_NAME[a.name] = a; }

  c = mk(a.w, a.h); const x = ctx2(c); x.translate(a.w, 0); x.scale(-1, 1); x.drawImage(a.cv, 0, 0);

}

  const k = a.id + color + (fl ? 'f' : ''); let c = _outline.get(k); if (c) return c;
  const src = fl ? flipped(a) : a.cv;

function shadowOf(w) {

/* fallback keyword rules for any sprite name that has no entry above */
const ROLE_RULES = [[/archer|ranger|bow/i, 'R'], [/wizard|mage|lich|warlock|witch|hag|dryad|sage|druid/i, 'W'], [/priest|monk|cleric|angel|saint/i, 'H'],
[/knight|golem|templar|shield/i, 'T'], [/bandit|rogue|fencer|imp|assassin/i, 'A'], [/troll|ettin|giant|brute|golem/i, 'G'], [/dragon|drake/i, 'X'], [/rat|ant|spider|bug|slime|worm/i, 'S']];

const FLAVOR_BY_ROLE = {
  M: 'A dependable frontline fighter.', T: 'Armored and stubborn.', A: 'Strikes fast and slips away.', R: 'Keeps its distance and shoots.', W: 'Throws magic from behind the front.',
  H: 'Mends allies while the fight rages.', B: 'Wild and quick.', S: 'Cheap, fast, and everywhere at once.', G: 'Big, slow and brutally strong.', X: 'A legend that bends the whole fight around it.',
};
/* colour of blood / debris particles by creature type */
function goreColor(a) {
  const n = a.name;
  if (a.group === 'undead' || /Skeleton|Lich|Death Knight|Zombie|Ghoul/.test(n)) return '#e6e1c8';
  if (a.group === 'Slime') return '#7fd05a';
  if (/Golem/.test(n)) return '#9aa0aa';
  if (/Banshee|Wraith|Reaper|Spirit|Faceless|Cultist|Cardinal|Angel/.test(n)) return '#9fc4ff';
  if (a.group === 'bugs') return '#b6d44a';
  if (/Dryad|Satyr|Hag/.test(n)) return '#b24a4a';
  return '#c4262f';
}

/* ===== build the unit type table ===== */
const UNITS = [];          // all unit types (manifest order)
const UT = {};             // asset id -> type
const UT_BY_NAME = {};
const CAT_TREE = {};       // category -> {groups:[{key,label,sub,units:[]}]}
function buildCatalog() {
  for (const a of AS_LIST) {
    if (!['Humans', 'Monsters', 'Animals'].includes(a.category)) continue;
    let d = UD[a.name];
    if (!d) { let role = 'M'; for (const [re, rc] of ROLE_RULES) if (re.test(a.name)) { role = rc; break; } d = { role, tier: 1, o: {} }; console.warn('no unit definition for', a.name, '- using keyword rules'); }
    const o = d.o, R = ROLES[d.role];
    const tier = d.tier, ti = tier - 1;
    const tr = Object.assign({}, o.tr || {});
    if (d.role === 'R' && !tr.ranged && !tr.magic) tr.ranged = { proj: 'arrow', pierce: 0 };
    if (d.role === 'W' && !tr.magic) tr.magic = MAG('#8ab4ff');
    if (d.role === 'H' && !tr.healer) tr.healer = { amt: Math.round(TIER_DMG[ti] * 1.5), cd: 1.5, r: R.rg };
    if (tr.healer && !tr.healer.amt) tr.healer.amt = Math.round(TIER_DMG[ti] * 1.5);
    if (o.fl) tr.flying = true;
    const ranged = !!(tr.ranged || tr.magic);
    const proj = tr.ranged ? tr.ranged.proj : (tr.magic ? (tr.magic.proj || 'orb') : null);
    const rngDefault = d.role === 'M' || d.role === 'T' || d.role === 'A' || d.role === 'B' || d.role === 'S' || d.role === 'G' || d.role === 'X' ? R.rg : R.rg;
    const base = {
      hp: Math.round(TIER_HP[ti] * R.hp * (o.hp || 1)),
      dmg: +(TIER_DMG[ti] * R.dm * (o.dm || 1)).toFixed(1),
      aps: +(R.as * (o.as || 1)).toFixed(2),
      rng: o.rg != null ? o.rg : (ranged && R.rg < 60 ? 100 : rngDefault),
      spd: Math.round(R.sp * (o.sp || 1)),
      arm: Math.round((R.arm || 0) + (o.ar || 0) + (d.role === 'T' ? tier * 4 : tier * 0.8)),
      mr: d.role === 'W' ? 18 + tier * 4 : (d.role === 'H' ? 12 + tier * 3 : Math.round(tier * 2) + (o.ar ? o.ar * .3 | 0 : 0)),
      crit: o.crit != null ? o.crit : (R.crit || 0.05), critMul: 1.8,
      ls: tr.lifesteal ? tr.lifesteal.pct : 0, regen: tr.regen ? tr.regen.hps : 0,
      dodge: o.dodge != null ? o.dodge : (R.dodge || 0),
      kb: +((o.kb != null ? o.kb : R.kb || 1)).toFixed(2), kbr: o.kbr != null ? o.kbr : (R.kbr || 0),
      aggro: R.aggro, pspd: { arrow: 270, arrowB: 270, bolt: 310, orb: 200, fire: 165, holy: 220, spit: 175, spike: 245 }[proj] || 0,
      splash: tr.splash ? tr.splash.r : 0, size: 1, mass: 1, pa: o.pa || 0, blk: 0, vsG: 0,
    };
    const r = clamp(a.bw * 0.3 + a.bh * 0.05, 3.5, 13);
    base.mass = +(r * r / 36).toFixed(2);
    const t = {
      id: a.id, asset: a, name: a.name, category: a.category, group: a.group, path: a.category + ' › ' + groupName(a.group) + ' › ' + a.name,
      role: d.role, roleName: R.name, tier, tierName: TIER_NAMES[ti], tr, base, ranged, proj, flying: !!o.fl,
      nativeLeft: !o.fr, r, feet: a.by + a.bh, gore: goreColor(a), desc: o.desc || null,
    };
    t.search = (t.name + ' ' + t.group + ' ' + (GROUP_LABEL[t.group] || '') + ' ' + R.name + ' ' + Object.keys(tr).map(k => TRAIT_DEFS[k] ? TRAIT_DEFS[k].name : k).join(' ')).toLowerCase();
    t.description = describeUnit(t);
    UNITS.push(t); UT[t.id] = t; UT_BY_NAME[t.name] = t;
    const cat = CAT_TREE[a.category] || (CAT_TREE[a.category] = { groups: [] });
    let g = cat.groups.find(x => x.key === a.group);
    if (!g) { g = { key: a.group, label: groupName(a.group), sub: GROUP_LABEL[a.group] || '', units: [] }; cat.groups.push(g); }
    g.units.push(t);
  }
}
function describeUnit(t) {
  const R = ROLES[t.role];
  if (t.desc) return t.desc + ' ' + R.style;
  const names = Object.keys(t.tr).filter(k => k !== 'flying' && TRAIT_DEFS[k]).map(k => TRAIT_DEFS[k].name.toLowerCase());
  let s = `${FLAVOR_BY_ROLE[t.role]} ${R.style}`;
  if (t.tr.flying) s += ' Flies over obstacles.';
  if (names.length) s += ' Traits: ' + names.join(', ') + '.';
  return s;
}

/* =====================================================================
   STATS — three stacking layers (global type default -> per-batch -> live per-unit), then
   equipment + buffs:  final = (resolved + sum(flat)) x product(mul), then "atLeast" floors.
   Traits are layered the same way (object = on with params, null = switched off).

  if (d && d.kind === 'select' && d.moved) { const x = sx(Math.min(d.x0, INP.wx)), y = sy(Math.min(d.y0, INP.wy)), w = Math.abs(INP.wx - d.x0) * S, h = Math.abs(INP.wy - d.y0) * S; c.fillStyle = 'rgba(61,185,255,.14)'; c.fillRect(x, y, w, h); c.strokeStyle = '#3db9ff'; c.lineWidth = 1; c.strokeRect(x + .5, y + .5, w, h); }
}

/* =====================================================================
   MAIN — boot sequence, fixed-timestep loop, resize, FPS readout, auto juice reduction
   ===================================================================== */
const LOOP = { last: 0, acc: 0, fps: 60, fpsAcc: 0, frames: 0, simMs: 0, rndMs: 0, lowT: 0, hiT: 0, autoLow: false, miniAcc: 0, hudAcc: 0 };

function showLoading(msg, pct) {
  let l = document.getElementById('loadscr');
  if (!l) { l = document.createElement('div'); l.id = 'loadscr'; l.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#070d14;color:#cfe3f3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 22px Rajdhani,sans-serif;letter-spacing:.1em;text-transform:uppercase'; l.innerHTML = '<div id="loadt"></div><div style="width:260px;height:6px;background:#12202d;border-radius:3px;overflow:hidden"><i id="loadb" style="display:block;height:100%;width:0;background:#3db9ff"></i></div><pre id="loade" style="font:12px monospace;color:#ff8a8a;white-space:pre-wrap;max-width:80vw;text-transform:none;letter-spacing:0"></pre>'; document.body.appendChild(l); }
  document.getElementById('loadt').textContent = msg; if (pct != null) document.getElementById('loadb').style.width = Math.round(pct * 100) + '%';
}
function hideLoading() { const l = document.getElementById('loadscr'); if (l) l.remove(); }

function onResize() {
  if (!cvs) return; const keepX = CAM.x, keepY = CAM.y;
  const rect = cvs.parentElement.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
  const w = Math.max(2, Math.round(rect.width * dpr)), h = Math.max(2, Math.round(rect.height * dpr));
  if (w === cvs.width && h === cvs.height && dpr === CAM.dpr) return;
  cvs.width = w; cvs.height = h; CAM.dpr = dpr; CAM.W = w; CAM.H = h; ctx = cvs.getContext('2d', { alpha: false }); ctx.imageSmoothingEnabled = false;
  CAM.x = keepX; CAM.y = keepY; updateScale();
}

function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); let rdt = (now - LOOP.last) / 1000; LOOP.last = now;
  if (!(rdt > 0)) rdt = 1 / 60; rdt = Math.min(rdt, .1);
  /* ---- simulation: fixed step with accumulator and a time budget ---- */
  let ticks = 0, simMs = 0; const DT = CFG.SIM_DT;
  if (S.running && !S.over) {
    if (S.hitstop > 0) S.hitstop = Math.max(0, S.hitstop - rdt); // freeze sim for a few frames on big hits
    else LOOP.acc = Math.min(LOOP.acc + rdt * S.speed * (S.slowmo > 0 ? .22 : 1), CFG.MAX_ACCUM * Math.max(1, S.speed));
    const budget = CFG.SIM_BUDGET_MS, s0 = performance.now(); S.simLag = false;
    while (LOOP.acc >= DT) {
      simTick(DT); LOOP.acc -= DT; ticks++;
      if (performance.now() - s0 > budget) { S.simLag = LOOP.acc > DT * 2; if (S.simLag) LOOP.acc = Math.min(LOOP.acc, DT * 1.5); break; }
    }
    simMs = performance.now() - s0;
  } else {
    S.simLag = false; LOOP.acc = 0;
    if (S.stepOnce || S.stepN) { const n = S.stepN || 1; S.stepOnce = false; S.stepN = 0; for (let i = 0; i < n; i++) simTick(DT); ticks = n; }
  }
  /* ---- interpolation factor ---- */
  const alpha = S.running && !S.over ? clamp(LOOP.acc / DT, 0, 1) : 1;
  const sdt = S.running && !S.over ? rdt * Math.min(S.speed, 4) : rdt; // cosmetics keep animating while paused (pop-in, rings, floaters)
  if (S.slowmo > 0) S.slowmo = Math.max(0, S.slowmo - rdt);
  tweenSizes(rdt);
  fxUpdate(sdt * (S.slowmo > 0 ? .3 : 1), rdt);
  godUpdate(rdt); if (REPLAY.on) { S.stepOnce = false; S.stepN = 0; replayStep(rdt); }
  keyboardPan(rdt); updateCamera(rdt);
  if (SET.hpMode !== 'off' || true) { /* hover query runs every frame (cheap) */ }
  updateHover();
  ambUpdate(rdt, CAM, CAM.W / CAM.S, CAM.H / CAM.S);
  const r0 = performance.now(); render(alpha, rdt); LOOP.rndMs += performance.now() - r0 - 0;
  drawMinimap(rdt);
  updateHud(rdt);
  /* ---- fps readout + adaptive juice ---- */
  LOOP.frames++; LOOP.fpsAcc += rdt; LOOP.simMs += simMs;
  if (LOOP.fpsAcc >= .5) {
    LOOP.fps = LOOP.frames / LOOP.fpsAcc;
    if (SET.fps) { const fb = $('fpsbox'); fb.textContent = `${LOOP.fps.toFixed(0)} fps · sim ${(LOOP.simMs / LOOP.frames).toFixed(1)}ms · draw ${(LOOP.rndMs / LOOP.frames).toFixed(1)}ms · ${S.units.length} units · ${PT_COUNT()} fx`; }
    if (LOOP.fps < 32 && S.units.length > 600) { LOOP.lowT += LOOP.fpsAcc; LOOP.hiT = 0; if (LOOP.lowT > 3 && !FX.low) { FX.low = LOOP.autoLow = true; toast('Performance mode: fewer particles. Lower the unit cap or zoom out for more speed.'); } }
    else { LOOP.lowT = 0; if (FX.low && LOOP.autoLow && LOOP.fps > 52) { LOOP.hiT += LOOP.fpsAcc; if (LOOP.hiT > 6) { FX.low = SET.lowPower; LOOP.autoLow = false; } } }
    LOOP.fpsAcc = 0; LOOP.frames = 0; LOOP.simMs = 0; LOOP.rndMs = 0;
  }
}
function PT_COUNT() { let n = 0; const l = PT.life; for (let i = 0; i < l.length; i += 8) if (l[i] > 0) n++; return n * 8; }

async function boot() {
  try {
    showLoading('Loading sprites…', 0);
    await loadAssets(p => showLoading('Loading sprites…', p));
    showLoading('Building battlefield…', 1);
    await new Promise(r => setTimeout(r, 16));
    buildCatalog(); initTeams(); loadSettings();
    for (const k in RULES) { /* rules may have been restored from settings */ }
    recomputeHostile();
    buildWorld({}); resizeGrid();
    buildTopbar(); buildTools(); buildSpawnBar(); buildItems(); buildDrawer(); buildPanel();
    applySettings(); initTooltips(); buildTopbarExtras(); initAudio(); initI18n();
    SP.type = UT_BY_NAME['Knight'] || UNITS[0]; selectUnitType(SP.type); $('formSel').value = SP.formation;
    setupCanvas(); initInput(); initDragDrop(); setTool('spawn'); setSpeed(1);
    fitCamera(); focusOn(W.w / 2, W.h / 2, CFG.DEFAULT_ZOOM);
    reseed(); hudTeamsChanged(); updatePlayBtn(); refreshWorldPane && refreshWorldPane();
    window.addEventListener('resize', onResize);
    if (window.ResizeObserver) new ResizeObserver(onResize).observe(cvs.parentElement);
    hideLoading();
    LOOP.last = performance.now(); requestAnimationFrame(frame);
    window.__bfs = { S, W, TEAMS, CAM, SP, UNITS, UT_BY_NAME, spawnBatch, spawnDemo, simTick, LOOP, FX, SET, ITEMS, ITEM_BY_NAME, ITEM_BY_ID, equipItem, applyEffect, mkPickup, PK, EFFECTS, recalcStats, setSize, setStat, setTraitParams, toggleTrait, TRAIT_KEYS, randomLoadout, makeElite, resetScope, ST, IT, stRefresh, itRefresh, pkRefresh, isBoss, SLASHES, fxWeaponArc, PK_PRESETS, TRAIT_SCHEMA, asByName, GOD, POWERS, castGod, godSetPower, BUILD, placeBuild, addHazard, paintObstacle, SND, sfx, LANG, setLang, FA, trStr, serializeGame, applyGame, parseSaveText, toShare, saveSlot, loadSlot, PRESETS, loadPreset, HIST, REC, REPLAY, startReplay, replayStop, replayStep, openGraph, takeScreenshot, openCodex, codexBuild, CX, i18nApply, CFG, TOOLS, DRAWER_TABS, STR, TRAIT_DEFS, STAT_DEFS, STAT_LABEL, ROLES, FLAVOR_BY_ROLE, TIER_NAMES, RARITY, ITEM_SLOTS, SLOT_LABEL, BIOMES, ZONE_LABEL, RULE_DEFS, ORDER_DEFS, FORMATIONS, MODES, HAZARD_DEFS, WALL_STYLES, GROUP_LABEL, SIZE_PRESETS, HOTKEYS, UI_INFO, STATUS_INFO, CODEX_OV, EFFECT_KEYS, CAT_TREE, CUSTOM_ITEMS, ready: true };
    if (!lsGet('bfs.seen', 0)) openQuickStart();
  } catch (e) {
    console.error(e); showLoading('Could not start', 1);
    const pe = document.getElementById('loade'); if (pe) pe.textContent = String(e && e.stack || e);
  }
}
window.addEventListener('error', e => { try { console.error('Unhandled', e.message); } catch (_) {} });
boot();

/* =====================================================================
   ANDROID APP SUPPORT — active only inside the Android wrapper (it injects `window.AndroidBridge`).
   · Back button → "Exit game?" dialog (custom modal)    · files (JSON / PNG) are saved through the native bridge
   · compact phone layout: drawer starts collapsed        · no long-press menus
   On the web nothing here runs, so the same HTML works in a browser.
   ===================================================================== */
const IS_APP = typeof window !== 'undefined' && !!window.AndroidBridge;
faAdd({ 'Exit game?': 'از بازی خارج می‌شوید؟', 'Exit': 'خروج', 'Stay': 'ماندن',
  'The current battle is lost unless you saved it in the Data tab.': 'اگر نبرد فعلی را در تب داده ذخیره نکرده باشید از بین می‌رود.',
  'Saved to Downloads: ': 'در پوشه Downloads ذخیره شد: ', 'Could not save the file.': 'ذخیره فایل ممکن نشد.' });

let exitOpen = false;
function showExitDialog() {
  exitOpen = true;
  modal({ title: 'Exit game?', width: '380px', body: '<div class="hint">The current battle is lost unless you saved it in the Data tab.</div>',
    buttons: [{ label: 'Stay', cls: 'on' }, { label: 'Exit', fn: () => { try { window.AndroidBridge.exit(); } catch (e) { } } }], onClose: () => { exitOpen = false; } });
}
/* called by the native Back button; returns nothing, the native side never closes the app by itself */
window.__androidBack = function () {
  try {
    if (exitOpen) { closeModal(); return; }
    if (typeof modalOpen === 'function' && modalOpen()) { closeModal(); return; }
    if (REPLAY.on) { replayStop(); return; }
    if (document.body.classList.contains('nui')) { toggleUi(); return; }
    if (typeof INP !== 'undefined' && INP.down) { INP.down = null; INP.brush = null; return; }
    showExitDialog();
  } catch (e) { try { window.AndroidBridge.exit(); } catch (e2) { } }
};
/* the native side reports the result of a save */
window.__androidSaved = function (ok, where) { toast(ok ? tr('Saved to Downloads: ') + where : tr('Could not save the file.'), ok ? 'good' : 'warn'); };

/* later declaration wins over the one in 75_save.js: save through the native bridge when present */
function downloadBlob(blob, filename) {
  if (IS_APP) {
    try {
      const fr = new FileReader();
      fr.onload = () => { try { const s = String(fr.result), i = s.indexOf(','); window.AndroidBridge.saveFile(filename, blob.type || 'application/octet-stream', s.slice(i + 1)); } catch (e) { toast('Could not save the file.', 'warn'); } };
      fr.readAsDataURL(blob); return true;
    } catch (e) { return false; }
  }
  try { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 500); return true; } catch (e) { return false; }
}

function initAndroid() {
  if (!IS_APP) return;
  document.body.classList.add('app');
  document.addEventListener('contextmenu', e => e.preventDefault());
  if (innerHeight < 650) { document.body.classList.add('dclosed'); setTimeout(onResize, 60); } /* phone: start with the drawer collapsed */
}
try { initAndroid(); } catch (e) { }
