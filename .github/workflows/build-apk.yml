name: Build Android APK

# Click "Run workflow" on the Actions tab to build. Nothing runs by itself.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download fonts into the app (optional, never fails)
        run: bash tools/fetch-fonts.sh

      - name: Check the signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::The secret $v is missing. Add it in Settings > Secrets and variables > Actions."; missing=1; fi
          done
          exit $missing

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_BASE64 could not be decoded. Copy the whole text again."; exit 1; }

      - name: Build the SIGNED release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Build the debug APK (quick test copy)
        run: gradle --no-daemon assembleDebug

      - name: Verify the signature, package name and version
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::The signed APK was not produced."; exit 1; }
          echo "=== signature ==="
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "=== package / version / permissions ==="
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^application-label:|^launchable-activity|^uses-permission|^sdkVersion|^targetSdkVersion" || true
          if "$BT/aapt2" dump badging "$APK" | grep "^uses-permission" | grep -qv "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"; then echo "::warning::The APK asks for permissions (it should not)."; fi
          mkdir -p dist
          VN=$(grep '^VERSION_NAME=' app.properties | cut -d= -f2 | tr -d ' \r')
          cp "$APK" "dist/BattlefieldSandbox-$VN-release-signed.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/BattlefieldSandbox-$VN-debug.apk"
          ls -l dist

      - name: Upload the signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: BattlefieldSandbox-release-signed
          path: dist/*-release-signed.apk
          if-no-files-found: error

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BattlefieldSandbox-debug-for-testing
          path: dist/*-debug.apk
          if-no-files-found: error
